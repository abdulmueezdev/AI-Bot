name: CI — Digital Clone AI Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-typecheck-test:
    name: Lint → Typecheck → Test
    runs-on: ubuntu-latest

    env:
      # Test-safe placeholder secrets — no real API calls in CI
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-groq-key' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test-openrouter-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-gemini-key' }}
      ENVIRONMENT: testing
      LOG_LEVEL: WARNING
      CHROMA_PERSIST_DIR: /tmp/ci_chroma
      CLONE_DATA_DIR: ./backend/clones

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check .

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70 -v
